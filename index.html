<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Interactive 3D model of the Solar System built with Three.js.">
  <title>Interactive Solar System</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<div id="loading">Generating textures…</div>

<div id="info">
  <strong>Interactive Solar System</strong>
  <small>Click or tap a planet to focus · Drag to rotate · Scroll or pinch to zoom · Esc to exit focus</small>
</div>

<div id="labels"></div>

<aside id="panel" hidden aria-live="polite">
  <button id="exitFocus" type="button" class="btn">Exit focus</button>
  <h2 id="panelName"></h2>
  <p id="panelType" class="type"></p>
  <dl>
    <dt>Diameter</dt><dd id="panelDiameter"></dd>
    <dt>Distance from Sun</dt><dd id="panelDistance"></dd>
    <dt>Orbital period</dt><dd id="panelPeriod"></dd>
  </dl>
  <p id="panelFact" class="fact"></p>
</aside>

<div id="ui">
  <label for="speed">
    Orbit Speed
    <input type="range" id="speed" min="0" max="5" step="0.1" value="1">
    <span id="speedValue">1.0×</span>
  </label>
  <div class="buttons">
    <button id="pause" type="button" class="btn" aria-pressed="false">Pause</button>
    <button id="toggleLabels" type="button" class="btn" aria-pressed="true">Labels: on</button>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
